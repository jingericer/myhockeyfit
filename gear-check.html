<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071426">
  <meta name="description" content="Check whether a child's hockey stick, gloves or shin guards still fit with simple at home steps.">
  <title>Check gear you own | MyHockeyFit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="gear-check.css?v=1">
</head>
<body>
  <header class="gc-header"><a href="/" class="gc-brand">MYHOCKEY<span>FIT</span></a><a href="/" class="gc-home">← Equipment</a></header>
  <main class="gc-shell">
    <p class="gc-eyebrow">MYHOCKEYFIT · GEAR CHECK</p>
    <h1>Does their gear still fit?</h1>
    <p class="gc-intro">Check the gear your player already owns. Takes about a minute.</p>
    <div class="gc-progress" id="progress" aria-label="Step progress"></div>
    <section id="checkStep" aria-live="polite"></section>
    <div class="gc-actions" id="actions"><button type="button" id="backButton" class="gc-back" hidden>Back</button><button type="button" id="nextButton" class="gc-next" disabled>Continue →</button></div>
    <section id="checkResult" class="gc-result" hidden aria-live="polite"></section>
  </main>
  <footer>Based on <a href="https://www.hockeycanada.ca/en-ca/hockey-programs/players/essentials/equipment-fitting" target="_blank" rel="noopener noreferrer">Hockey Canada's equipment fitting guide</a> and <a href="https://ca.bauer.com/pages/flex-guide-stick" target="_blank" rel="noopener noreferrer">Bauer's stick length guide</a>. An at home check cannot confirm fit or protection in every position.</footer>
  <script src="gear-check.js?v=1" defer></script>
</body>
</html>
